services:
  - type: web
    name: mc-economie
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false   # à renseigner si le frontend est hébergé ailleurs
    disk:
      name: data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
